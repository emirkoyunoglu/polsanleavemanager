# scripts/check.conf — the steps behind ./scripts/check (docs/testing.md).
# Stack: Python 3.14 · FastAPI · SQLAlchemy/SQLite · pytest · Playwright (ADR 0001, 0002).
# Commands assume the project virtualenv is active (docs/conventions.md; CI installs into its own Python).
# A step is enabled as soon as the thing it checks exists — pytest exits 5 on "no tests collected",
# so the e2e step goes live with the first e2e test (F8).
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene):
#   ruff, lint-imports, pip-audit — run once and exit; nothing left behind.
#   mypy — plain mypy, never dmypy.        # resource hygiene: no type-check daemon
#   pytest — no pytest-xdist (-n).         # resource hygiene: no parallel workers
#   integration — FastAPI TestClient is in-process; no server, SQLite file under tmp_path.
#   e2e — browser owned by pytest-playwright fixtures (headless by default); uvicorn owned by one
#         session fixture, stopped in finally (failure and timeout included).
#
# Profiles: [fast] = lint, format, types, boundaries, unit tests (marker selector).
# Full only  = integration + e2e (the inverted selector: fast ∪ these = every test) and pip-audit.

lint [fast]: python -m ruff check .
format [fast]: python -m ruff format --check .
types [fast]: python -m mypy app tests
boundaries [fast]: lint-imports
unit [fast]: python -m pytest -q -p no:cacheprovider -m "not integration and not e2e"
integration: python -m pytest -q -p no:cacheprovider -m "integration and not e2e"
# e2e: python -m pytest -q -p no:cacheprovider -m e2e --browser chromium
audit: python -m pip_audit
