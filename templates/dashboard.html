<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kurs İlerleme Dashboard'u</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
  <h1 class="h3 mb-3">Kurs İlerleme Dashboard'u</h1>

  <form method="post" enctype="multipart/form-data" class="card card-body mb-3">
    <label for="file" class="form-label">LearnHouse ilerleme dosyası (.csv / .xlsx)</label>
    <div class="input-group">
      <input class="form-control" type="file" id="file" name="file" accept=".csv,.xlsx" required>
      <button class="btn btn-primary" type="submit">Yükle</button>
    </div>
  </form>

  {% if error %}
  <div class="alert alert-danger" role="alert">{{ error }}</div>
  {% endif %}

  {% if filename %}
  <p class="mb-3"><strong>{{ filename }}</strong> — toplam <strong>{{ total }}</strong> kayıt</p>

  <div class="card">
    <div class="card-header">İlk {{ preview|length }} satır</div>
    <div class="table-responsive">
      <table class="table table-sm table-striped mb-0">
        <thead><tr>{% for h in headers %}<th>{{ h }}</th>{% endfor %}</tr></thead>
        <tbody>
        {% for row in preview %}
          <tr>{% for v in row %}<td>{{ v }}</td>{% endfor %}</tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
  {% endif %}
</main>
</body>
</html>
